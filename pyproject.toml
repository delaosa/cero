[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cero"
version = "0.1.0"
description = "CERO Electron, Reproduce Only — Native Music Assistant player for Linux with GTK4, Sendspin and MPRIS2 (playerctl)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "delaosa" }]
requires-python = ">=3.13"
keywords = ["music-assistant", "gtk4", "libadwaita", "mpris", "sendspin", "music-player"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
# GTK4, Libadwaita, GStreamer and PyGObject come from the system (see README.md)
dependencies = [
    "music-assistant-client>=1.8.0",
    "aiosendspin>=10.3.0",
    "zeroconf>=0.140.0",
]

[project.urls]
Homepage = "https://github.com/delaosa/cero"
Source = "https://github.com/delaosa/cero"
Issues = "https://github.com/delaosa/cero/issues"

[project.scripts]
cero = "cero.__main__:main"

[tool.setuptools.packages.find]
include = ["cero*"]

[tool.setuptools.package-data]
cero = ["style.css"]
